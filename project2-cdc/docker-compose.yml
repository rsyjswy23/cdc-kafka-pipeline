services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ============================================
  # SCHEMA REGISTRY - NEW SERVICE
  # ============================================
  # Manages and stores Avro schemas for Kafka messages
  # Ensures producers and consumers agree on data format
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8081:8081"  # REST API endpoint for schema management
    environment:
      # Hostname of the schema registry itself
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      
      # Tell schema registry how to connect to Kafka (internal network)
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      
      # Where the schema registry listens for API calls
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      
      # Schema compatibility level: BACKWARD means new schemas can read old data
      SCHEMA_REGISTRY_COMPATIBILITY_LEVEL: BACKWARD

  source_db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sourcedb
    ports:
      - "5433:5432"
    volumes:
      - source_data:/var/lib/postgresql/data

  dest_db:
    image: postgres:14.1-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: destdb
    ports:
      - "5434:5432"
    volumes:
      - dest_data:/var/lib/postgresql/data

volumes:
  source_data:
  dest_data: